<script>
var PRIVACY_CONTENT = '<h3 style="color:#0A2463;font-size:16px;font-weight:700;margin:0 0 12px;">1. Information We Collect</h3><p>MaisonQuest collects information you provide when creating an account (name, email, phone), when submitting inquiries, and when interacting with listings.</p><br><h3 style="color:#0A2463;font-size:16px;font-weight:700;margin:0 0 12px;">2. How We Use Your Information</h3><p>Your information is used to provide and improve the MaisonQuest service. We do not sell your personal data to third parties.</p><br><h3 style="color:#0A2463;font-size:16px;font-weight:700;margin:0 0 12px;">3. Data Sharing</h3><p>We share your contact information with agencies only when you initiate an inquiry. Agency partners are contractually obligated to keep your data confidential.</p><br><h3 style="color:#0A2463;font-size:16px;font-weight:700;margin:0 0 12px;">4. Cookies</h3><p>MaisonQuest uses session storage to remember your language and currency preferences. We do not use third-party tracking cookies.</p><br><h3 style="color:#0A2463;font-size:16px;font-weight:700;margin:0 0 12px;">5. Your Rights</h3><p>You may request access to, correction of, or deletion of your personal data at any time by contacting us at privacy@maisonquest.cm.</p><br><h3 style="color:#0A2463;font-size:16px;font-weight:700;margin:0 0 12px;">6. Updates</h3><p>Last updated: January 2026.</p>';
var TERMS_CONTENT = '<h3 style="color:#0A2463;font-size:16px;font-weight:700;margin:0 0 12px;">1. Acceptance of Terms</h3><p>By using MaisonQuest, you agree to these Terms of Service. These terms apply to all users.</p><br><h3 style="color:#0A2463;font-size:16px;font-weight:700;margin:0 0 12px;">2. Platform Purpose</h3><p>MaisonQuest is a property listing marketplace connecting renters with verified real estate agencies in Cameroon. We do not participate in transactions or collect payments.</p><br><h3 style="color:#0A2463;font-size:16px;font-weight:700;margin:0 0 12px;">3. Agency Responsibilities</h3><p>Agencies are responsible for the accuracy of their listings. Fraudulent listings result in immediate account suspension.</p><br><h3 style="color:#0A2463;font-size:16px;font-weight:700;margin:0 0 12px;">4. Renter Responsibilities</h3><p>Renters agree to use the platform in good faith. Abuse of the messaging system is prohibited.</p><br><h3 style="color:#0A2463;font-size:16px;font-weight:700;margin:0 0 12px;">5. Safety</h3><p>Never transfer money before physically visiting a property and signing a lease.</p><br><h3 style="color:#0A2463;font-size:16px;font-weight:700;margin:0 0 12px;">6. Limitation of Liability</h3><p>MaisonQuest is not liable for disputes between renters and agencies.</p><br><h3 style="color:#0A2463;font-size:16px;font-weight:700;margin:0 0 12px;">7. Changes</h3><p>Terms may be updated at any time. Last updated: January 2026.</p>';
function openPolicyModal(type) {
  var o = document.getElementById('policy-modal-overlay');
  document.getElementById('policy-modal-title').textContent = type==='privacy' ? 'Privacy Policy' : 'Terms of Service';
  document.getElementById('policy-modal-body').innerHTML = type==='privacy' ? PRIVACY_CONTENT : TERMS_CONTENT;
  o.style.display='flex'; document.body.style.overflow='hidden';
}
function closePolicyModal() {
  document.getElementById('policy-modal-overlay').style.display='none';
  document.body.style.overflow='';
}
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closePolicyModal(); });
function submitContactForm() {
  var fname = document.getElementById('cf-fname').value.trim();
  var email = document.getElementById('cf-email').value.trim();
  var message = document.getElementById('cf-message').value.trim();
  if (!fname || !email || !message) { alert('Please fill in your name, email, and message.'); return; }
  document.getElementById('contact-form').style.display = 'none';
  document.getElementById('contact-success').style.display = 'block';
}
var MQ = {
  SESSION_KEY: 'mq_session', TIMEOUT_MS: 30*60*1000,
  save: function(t,n,i){sessionStorage.setItem(MQ.SESSION_KEY,JSON.stringify({type:t,name:n,initials:i,lastActive:Date.now()}));},
  get: function(){try{var r=sessionStorage.getItem(MQ.SESSION_KEY);if(!r)return null;var s=JSON.parse(r);if(Date.now()-s.lastActive>MQ.TIMEOUT_MS){MQ.clear();return null;}return s;}catch(e){return null;}},
  clear: function(){sessionStorage.removeItem(MQ.SESSION_KEY);sessionStorage.removeItem('mq_user_type');},
  logout: function(){MQ.clear();window.location.href='maisonquest-auth.html';},
  dashboardUrl: function(){var s=MQ.get();if(!s)return'maisonquest-auth.html';return s.type==='agency'?'maisonquest-dashboard.html':'maisonquest-renter-dashboard.html';},
  listProperty: function(){var s=MQ.get();if(s&&s.type==='agency'){window.location.href='maisonquest-dashboard.html?action=add-listing';}else{window.location.href='maisonquest-auth.html';}},
  toggleMenu: function(){var m=document.querySelector('.nav-user-menu');if(m)m.classList.toggle('open');},
  initNav: function(){
    var area=document.getElementById('nav-user-area');if(!area)return;
    var s=MQ.get();var fr=sessionStorage.getItem('mq_lang')==='FR';
    if(!s){area.innerHTML='<a href="maisonquest-auth.html" class="nav-signin">'+(fr?'Se connecter':'Sign In')+'</a>';return;}
    var atype=s.type==='agency'?(fr?'Compte agence':'Agency Account'):(fr?'Compte locataire':'Renter Account');
    area.innerHTML='<div class="nav-user-dropdown"><button class="nav-user-icon" onclick="MQ.toggleMenu()">'+s.initials+'</button><div class="nav-user-menu"><div class="nav-user-menu-header"><div class="nav-user-menu-name">'+s.name+'</div><div class="nav-user-menu-type">'+atype+'</div></div><a href="'+MQ.dashboardUrl()+'" class="nav-user-menu-item">Dashboard</a><div class="nav-user-menu-divider"></div><a href="'+MQ.dashboardUrl()+'?tab=settings" class="nav-user-menu-item">'+(fr?'Param\u00e8tres du compte':'Account Settings')+'</a><div class="nav-user-menu-divider"></div><button class="nav-user-menu-item danger" onclick="MQ.logout()">'+(fr?'Se d\u00e9connecter':'Sign Out')+'</button></div></div>';
    document.addEventListener('click',function(e){var d=document.querySelector('.nav-user-dropdown');if(d&&!d.contains(e.target)){var m=document.querySelector('.nav-user-menu');if(m)m.classList.remove('open');}});
  }
};
document.addEventListener('DOMContentLoaded', function(){ MQ.initNav(); });
</script>

  // Build reverse FR→EN map
  var EN = {};
  for (var k in FR) { EN[FR[k]] = k; }

  function applyLang(lang) {
    var dict = lang === 'FR' ? FR : EN;
    function walk(node) {
      if (node.nodeType === 3) {
        var t = node.textContent.trim();
        if (t && dict[t] !== undefined) {
          node.textContent = node.textContent.replace(t, dict[t]);
        }
      } else if (node.nodeType === 1) {
        var tag = node.tagName;
        if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'NOSCRIPT' || tag === 'TEXTAREA') return;
        // Translate placeholder and title attributes
        if (node.placeholder && dict[node.placeholder]) node.placeholder = dict[node.placeholder];
        if (node.title && dict[node.title]) node.title = dict[node.title];
        for (var i = 0; i < node.childNodes.length; i++) walk(node.childNodes[i]);
      }
    }
    walk(document.body);
    // Update lang buttons
    document.querySelectorAll('.lang-btn').forEach(function(b) {
      b.classList.toggle('active', b.textContent.trim() === lang);
    });
  }

  function setLang(lang) {
    sessionStorage.setItem('mq_lang', lang);
    if (lang === 'FR') {
      applyLang('FR');
      // Re-render the nav dropdown in French
      if (window.MQ && MQ.initNav) MQ.initNav();
    } else {
      window.location.reload();
    }
    document.querySelectorAll('.lang-btn').forEach(function(b) {
      b.classList.toggle('active', b.textContent.trim() === lang);
    });
  }

  function init() {
    // Wire buttons
    document.querySelectorAll('.lang-btn').forEach(function(btn) {
      btn.onclick = function() { setLang(btn.textContent.trim()); };
    });
    // Apply saved lang
    var saved = sessionStorage.getItem('mq_lang') || 'EN';
    if (saved === 'FR') applyLang('FR');
    document.querySelectorAll('.lang-btn').forEach(function(b) {
      b.classList.toggle('active', b.textContent.trim() === saved);
    });
  }

  // Expose globally so nav rebuild after dropdown open can re-translate
  window.MQLang = { setLang: setLang, applyLang: applyLang, init: init };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { setTimeout(init, 80); });
  } else {
    setTimeout(init, 80);
  }
})();
